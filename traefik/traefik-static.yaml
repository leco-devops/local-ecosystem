# Static Traefik configuration (entrypoints, API, file provider).
# Dynamic config directory: repo hosting/traefik/ → /etc/traefik-dynamic (watch: true).
# - Stack routes: traefik/dynamic.yml in git, copied to hosting/traefik/01-stack-core.yml on each traefik.sh start.
# - Merge fragment: hosting/traefik/dynamic.yml (leco-devops / LEco DevOps Routes; empty stub must be {}, not http: {}).
# Longer read timeouts reduce spurious
# "Error while Peeking first byte" when clients open :80/:443 then send slowly (host probes, preconnect).
global:
  checkNewVersion: false

api:
  # LOCAL ONLY. `insecure: true` serves the Traefik API and dashboard on :8080 with no
  # authentication, and ecosystem-stack/services/traefik.sh publishes that port on 0.0.0.0.
  # On a workstation that is a convenience; on a public VM `GET :8080/api/rawdata` returns the
  # whole routing table, every backend address and the TLS configuration to anyone who asks.
  #
  # This file is supposed to be the .lh-only config — traefik-static-acme.yaml (insecure: false)
  # is the one a cloud install should get. Today it does not: _traefik_tls_mode() in
  # ecosystem-stack/services/traefik.sh reads tls.mode inside a quoted heredoc (<<'PY'), so
  # "$DOCKER_BIND" is never expanded, the import fails, and the function always answers
  # "mkcert" — which selects THIS file even when leco-platform.yaml says tls.mode: acme.
  # Until that is fixed, any server running the stack is exposing :8080. Fix the heredoc, or
  # drop `-p 8080:8080` from traefik.sh, before putting this on a public address.
  insecure: true

providers:
  file:
    directory: /etc/traefik-dynamic
    watch: true

entryPoints:
  web:
    address: ":80"
    transport:
      respondingTimeouts:
        readTimeout: 120s
        idleTimeout: 180s
  websecure:
    address: ":443"
    transport:
      respondingTimeouts:
        readTimeout: 120s
        idleTimeout: 180s
