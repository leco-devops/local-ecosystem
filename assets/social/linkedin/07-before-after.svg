="600"/><line x1="0" y1="650" x2="1600" y2="650"/><line x1="0" y1="700" x2="1600" y2="700"/></g><text x="90" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#e2e8f0" text-anchor="start">The difference on day one</text><text x="90" y="122" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#94a3b8" text-anchor="start">Same containers. Different address space — and a routing shape you can actually ship.</text><g transform="translate(1360 44) scale(0.62)"><rect width="64" height="64" rx="14" fill="#1e2038"/><path fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linejoin="round" d="M32 9l19 11v24L32 55 13 44V20L32 9z"/><circle cx="32" cy="32" r="10" fill="#22d3ee"/></g><rect x="90" y="190" width="690.0" height="420" rx="20" fill="#12152a" stroke="#3a2b3f" stroke-width="1.5"/><text x="116" y="238" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fb7185" text-anchor="start" letter-spacing="0.18em">BEFORE</text><circle cx="134" cy="282" r="5" fill="#fb7185"/><text x="154" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#94a3b8" text-anchor="start">http://localhost:3000  ·  :8080  ·  :5432</text><circle cx="134" cy="340" r="5" fill="#fb7185"/><text x="154" y="346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#94a3b8" text-anchor="start">a port map only you remember</text><circle cx="134" cy="398" r="5" fill="#fb7185"/><text x="154" y="404" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#94a3b8" text-anchor="start">self-signed warnings, or plain HTTP</text><circle cx="134" cy="456" r="5" fill="#fb7185"/><text x="154" y="462" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#94a3b8" text-anchor="start">CORS and cookies behave differently than prod</text><circle cx="134" cy="514" r="5" fill="#fb7185"/><text x="154" y="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#94a3b8" text-anchor="start">"works on my machine" — and nowhere else</text><circle cx="134" cy="572" r="5" fill="#fb7185"/><text x="154" y="578" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#94a3b8" text-anchor="start">each new app fights the last one for a port</text><rect x="820.0" y="190" width="690.0" height="420" rx="20" fill="#12152a" stroke="#1f4a45" stroke-width="1.5"/><text x="846.0" y="238" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#34d399" text-anchor="start" letter-spacing="0.18em">AFTER</text><circle cx="864.0" cy="282" r="5" fill="#34d399"/><text x="884.0" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="start">https://myapp.lh  ·  https://api.myapp.lh</text><circle cx="864.0" cy="340" r="5" fill="#34d399"/><text x="884.0" y="346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="start">hostnames your team already says out loud</text><circle cx="864.0" cy="398" r="5" fill="#34d399"/><text x="884.0" y="404" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="start">TLS the browser trusts, no warning</text><circle cx="864.0" cy="456" r="5" fill="#34d399"/><text x="884.0" y="462" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="start">same Host-header routing as the real edge</text><circle cx="864.0" cy="514" r="5" fill="#34d399"/><text x="884.0" y="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="start">one machine, many apps, zero port clashes</text><circle cx="864.0" cy="572" r="5" fill="#34d399"/><text x="884.0" y="578" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="start">an agent can deploy it while you read this</text><text x="800" y="686" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="20" font-weight="400" fill="#22d3ee" text-anchor="middle">./ecosystem-stack/install-foundation.sh   →   ecosystem-stack.sh start   →   leco-devops onboard</text></svg>