<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow22d3ee" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#0b0d1a"/><g stroke="#141931" stroke-width="1" opacity="0.6"><line x1="50" y1="0" x2="50" y2="900"/><line x1="100" y1="0" x2="100" y2="900"/><line x1="150" y1="0" x2="150" y2="900"/><line x1="200" y1="0" x2="200" y2="900"/><line x1="250" y1="0" x2="250" y2="900"/><line x1="300" y1="0" x2="300" y2="900"/><line x1="350" y1="0" x2="350" y2="900"/><line x1="400" y1="0" x2="400" y2="900"/><line x1="450" y1="0" x2="450" y2="900"/><line x1="500" y1="0" x2="500" y2="900"/><line x1="550" y1="0" x2="550" y2="900"/><line x1="600" y1="0" x2="600" y2="900"/><line x1="650" y1="0" x2="650" y2="900"/><line x1="700" y1="0" x2="700" y2="900"/><line x1="750" y1="0" x2="750" y2="900"/><line x1="800" y1="0" x2="800" y2="900"/><line x1="850" y1="0" x2="850" y2="900"/><line x1="900" y1="0" x2="900" y2="900"/><line x1="950" y1="0" x2="950" y2="900"/><line x1="1000" y1="0" x2="1000" y2="900"/><line x1="1050" y1="0" x2="1050" y2="900"/><line x1="1100" y1="0" x2="1100" y2="900"/><line x1="1150" y1="0" x2="1150" y2="900"/><line x1="1200" y1="0" x2="1200" y2="900"/><line x1="1250" y1="0" x2="1250" y2="900"/><line x1="1300" y1="0" x2="1300" y2="900"/><line x1="1350" y1="0" x2="1350" y2="900"/><line x1="1400" y1="0" x2="1400" y2="900"/><line x1="1450" y1="0" x2="1450" y2="900"/><line x1="1500" y1="0" x2="1500" y2="900"/><line x1="1550" y1="0" x2="1550" y2="900"/><line x1="0" y1="50" x2="1600" y2="50"/><line x1="0" y1="100" x2="1600" y2="100"/><line x1="0" y1="150" x2="1600" y2="150"/><line x1="0" y1="200" x2="1600" y2="200"/><line x1="0" y1="250" x2="1600" y2="250"/><line x1="0" y1="300" x2="1600" y2="300"/><line x1="0" y1="350" x2="1600" y2="350"/><line x1="0" y1="400" x2="1600" y2="400"/><line x1="0" y1="450" x2="1600" y2="450"/><line x1="0" y1="500" x2="1600" y2="500"/><line x1="0" y1="550" x2="1600" y2="550"/><line x1="0" y1="600" x2="1600" y2="600"/><line x1="0" y1="650" x2="1600" y2="650"/><line x1="0" y1="700" x2="1600" y2="700"/><line x1="0" y1="750" x2="1600" y2="750"/><line x1="0" y1="800" x2="1600" y2="800"/><line x1="0" y1="850" x2="1600" y2="850"/></g><text x="90" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#e2e8f0" text-anchor="start">Deploy first. Configure never — unless you want to.</text><text x="90" y="122" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#94a3b8" text-anchor="start">LEco reads what you already built and writes the platform wiring next to it, never into it.</text><g transform="translate(1360 44) scale(0.62)"><rect width="64" height="64" rx="14" fill="#1e2038"/><path fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linejoin="round" d="M32 9l19 11v24L32 55 13 44V20L32 9z"/><circle cx="32" cy="32" r="10" fill="#22d3ee"/></g><rect x="90" y="190" width="560" height="600" rx="20" fill="#12152a" stroke="#20264a" stroke-width="1.5"/><text x="116" y="234" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start" letter-spacing="0.16em">YOUR REPOSITORY — UNTOUCHED</text><rect x="116" y="268" width="508" height="88" rx="14" fill="#1e2038" stroke="#333a63" stroke-width="1.4"/><text x="138" y="304" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="19" font-weight="600" fill="#e2e8f0" text-anchor="start">docker-compose.yml</text><text x="138" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start">root, infra/, deploy/, ops/, .docker/</text><rect x="116" y="368" width="508" height="88" rx="14" fill="#1e2038" stroke="#333a63" stroke-width="1.4"/><text x="138" y="404" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="19" font-weight="600" fill="#e2e8f0" text-anchor="start">wrangler.toml / .json / .jsonc</text><text x="138" y="432" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start">every worker in the workspace</text><rect x="116" y="468" width="508" height="88" rx="14" fill="#1e2038" stroke="#333a63" stroke-width="1.4"/><text x="138" y="504" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="19" font-weight="600" fill="#e2e8f0" text-anchor="start">.env  ·  .dev.vars</text><text x="138" y="532" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start">read, never rewritten</text><rect x="116" y="568" width="508" height="88" rx="14" fill="#1e2038" stroke="#333a63" stroke-width="1.4"/><text x="138" y="604" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="19" font-weight="600" fill="#e2e8f0" text-anchor="start">Dockerfile  ·  build context</text><text x="138" y="632" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start">kept as the app defines it</text><rect x="116" y="668" width="508" height="88" rx="14" fill="#1e2038" stroke="#333a63" stroke-width="1.4"/><text x="138" y="704" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="19" font-weight="600" fill="#e2e8f0" text-anchor="start">declared port tables</text><text x="138" y="732" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start">each port traced to a named file</text><rect x="740" y="400" width="200" height="96" rx="16" fill="#252845" stroke="#22d3ee" stroke-width="1.8"/><text x="840" y="438" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#22d3ee" text-anchor="middle">detect</text><text x="840" y="468" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" text-anchor="middle">+ evidence</text><path d="M 660 448 L 728 448" fill="none" stroke="#22d3ee" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow22d3ee)"/><path d="M 952 448 L 1030 448" fill="none" stroke="#22d3ee" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow22d3ee)"/><text x="840" y="344" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748b" text-anchor="middle">ports come from evidence,</text><text x="840" y="366" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748b" text-anchor="middle">never from invention</text><rect x="1040" y="190" width="470" height="600" rx="20" fill="#12152a" stroke="#20264a" stroke-width="1.5"/><text x="1066" y="234" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="0.16em">LECO WRITES — BESIDE IT</text><rect x="1066" y="268" width="418" height="88" rx="14" fill="#1e2038" stroke="#333a63" stroke-width="1.4"/><rect x="1066" y="282" width="5" height="60" rx="3" fill="#8b5cf6"/><text x="1088" y="304" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="19" font-weight="600" fill="#e2e8f0" text-anchor="start">leco.app.yaml</text><text x="1088" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start">bridge manifest · root: source</text><rect x="1066" y="368" width="418" height="88" rx="14" fill="#1e2038" stroke="#333a63" stroke-width="1.4"/><rect x="1066" y="382" width="5" height="60" rx="3" fill="#8b5cf6"/><text x="1088" y="404" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="19" font-weight="600" fill="#e2e8f0" text-anchor="start">leco.yaml</text><text x="1088" y="432" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start">profile · infrastructure · runtimes</text><rect x="1066" y="468" width="418" height="88" rx="14" fill="#1e2038" stroke="#333a63" stroke-width="1.4"/><rect x="1066" y="482" width="5" height="60" rx="3" fill="#8b5cf6"/><text x="1088" y="504" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="19" font-weight="600" fill="#e2e8f0" text-anchor="start">docker-compose.leco-*.yml</text><text x="1088" y="532" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start">overlay: lh-network, port remap</text><rect x="1066" y="568" width="418" height="88" rx="14" fill="#1e2038" stroke="#333a63" stroke-width="1.4"/><rect x="1066" y="582" width="5" height="60" rx="3" fill="#8b5cf6"/><text x="1088" y="604" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="19" font-weight="600" fill="#e2e8f0" text-anchor="start">hosting/traefik/&lt;slug&gt;.yml</text><text x="1088" y="632" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start">one route per public origin</text><rect x="1066" y="668" width="418" height="88" rx="14" fill="#1e2038" stroke="#333a63" stroke-width="1.4"/><rect x="1066" y="682" width="5" height="60" rx="3" fill="#8b5cf6"/><text x="1088" y="704" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="19" font-weight="600" fill="#e2e8f0" text-anchor="start">leco-registry.yaml row</text><text x="1088" y="732" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start">the app is now a first-class citizen</text><text x="90" y="848" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#94a3b8" text-anchor="start">Upstream stays clean: the hosting slot holds a symlink to your checkout, so you can pull, branch and delete without LEco leaving anything behind.</text></svg>